<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #191817; --bg-panel: #211F1E; --bg-inset: #2A2826;
  --ink: #EDEAE6; --ink-body: #C2BDB7; --ink-muted: #918B84;
  --rule: #363330; --rule-strong: #5E5852;
  --accent: #5AA687; --accent-soft: #24312C; --danger: #C4805F;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg-page); }
body { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--ink); text-decoration: underline; }
input { font-family: inherit; }
input::placeholder { color: var(--ink-muted); letter-spacing: 0.08em; font-size: 12px; }
*:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
</style>
</helmet>

<div style="width:1440px;min-height:940px;display:flex;flex-direction:column;background:var(--bg-page);color:var(--ink-body)">

  <div style="display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;border-bottom:1px solid var(--rule);flex:none">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="display:flex;color:var(--accent)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.6" y="1.6" width="16.8" height="16.8"></rect><polyline points="7.2,5.4 10.4,8.6 7.2,11.8"></polyline><rect x="5.4" y="14.2" width="9.2" height="1.8" fill="currentColor" stroke="none"></rect></svg></span>
      <span style="font-size:14px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink)">Kept</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Appearance</span>
      <div style="display:flex;border:1px solid var(--rule)">
        <button type="button" onClick="{{ setLight }}" style="padding:6px 12px;background:var(--seg-light-bg);border:none;border-right:1px solid var(--rule);font-family:inherit;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--seg-light-ink);cursor:pointer;transition:background 120ms">Light</button>
        <button type="button" onClick="{{ setDark }}" style="padding:6px 12px;background:var(--seg-dark-bg);border:none;font-family:inherit;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--seg-dark-ink);cursor:pointer;transition:background 120ms">Dark</button>
      </div>
    </div>
  </div>

  <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:96px 20px 80px">
    <div style="width:100%;max-width:452px;display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--rule-strong)">
        <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">{{ crumb }}</span>
        <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{ stepLabel }}</span>
      </div>

      <sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ true }}">
        <div style="background:var(--bg-panel);border:1px solid var(--rule);border-left:2px solid var(--accent);padding:28px 28px 24px;display:flex;flex-direction:column;gap:22px">

          <div style="display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px dotted var(--rule)">
            <span style="font-size:18px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink)">Sign in</span>
            <span style="font-size:12px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty">Enter your email and password to continue.</span>
          </div>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Email</span>
            <input type="email" defaultValue="janprzybysz2@gmail.com" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.02em">
          </label>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
              <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Password</span>
              <a href="#forgot" style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase">Forgot?</a>
            </span>
            <input type="password" defaultValue="stash1" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.18em">
          </label>

          <button type="button" style="height:40px;background:var(--accent);border:1px solid var(--accent);border-radius:0;color:var(--bg-page);font-family:inherit;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:background 120ms" style-hover="background:var(--ink)">Sign in</button>

          <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px">
            <span style="height:1px;background:var(--rule)"></span>
            <span style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-muted)">or</span>
            <span style="height:1px;background:var(--rule)"></span>
          </div>

          <button type="button" style="height:40px;display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:1px solid var(--rule-strong);border-radius:0;color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:background 120ms" style-hover="background:var(--bg-inset)">
            <span style="display:flex"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.08.55-.17.55-.38l-.01-1.49c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.67.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.14.47.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg></span>
            Continue with GitHub
          </button>

          <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding-top:16px;border-top:1px dotted var(--rule);font-size:11px;letter-spacing:0.08em;color:var(--ink-muted)">
            No account yet?
            <button type="button" onClick="{{ showRegister }}" style="background:transparent;border:none;padding:0;font-family:inherit;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px">Register</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <div style="background:var(--bg-panel);border:1px solid var(--rule);border-left:2px solid var(--accent);padding:28px 28px 24px;display:flex;flex-direction:column;gap:22px">

          <div style="display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px dotted var(--rule)">
            <span style="font-size:18px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink)">Create account</span>
            <span style="font-size:12px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty">Get started with Kept — one stash for links, snippets and commands.</span>
          </div>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Name</span>
            <input type="text" placeholder="Jan Przybysz" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.02em">
          </label>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Email</span>
            <input type="email" placeholder="you@studio.dev" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.02em">
          </label>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Password</span>
            <input type="password" placeholder="8+ characters" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.02em">
          </label>

          <label style="display:flex;flex-direction:column;gap:7px">
            <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)">Confirm password</span>
            <input type="password" placeholder="Repeat password" style="height:38px;padding:0 12px;background:var(--bg-inset);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-size:13px;letter-spacing:0.02em">
          </label>

          <button type="button" style="height:40px;background:var(--accent);border:1px solid var(--accent);border-radius:0;color:var(--bg-page);font-family:inherit;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:background 120ms" style-hover="background:var(--ink)">Create account</button>

          <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding-top:16px;border-top:1px dotted var(--rule);font-size:11px;letter-spacing:0.08em;color:var(--ink-muted)">
            Already registered?
            <button type="button" onClick="{{ showSignIn }}" style="background:transparent;border:none;padding:0;font-family:inherit;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px">Sign in</button>
          </div>
        </div>
      </sc-if>

      <div style="display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-muted)">
        <span>Encrypted at rest</span>
        <a href="#terms">Terms</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;screen&quot;: {
    &quot;editor&quot;: &quot;enum&quot;,
    &quot;options&quot;: [&quot;signin&quot;, &quot;register&quot;],
    &quot;default&quot;: &quot;signin&quot;,
    &quot;tsType&quot;: &quot;string&quot;,
    &quot;section&quot;: &quot;State&quot;
  },
  &quot;defaultDark&quot;: {
    &quot;editor&quot;: &quot;boolean&quot;,
    &quot;default&quot;: true,
    &quot;tsType&quot;: &quot;boolean&quot;,
    &quot;section&quot;: &quot;Theme&quot;
  },
  &quot;accent&quot;: {
    &quot;editor&quot;: &quot;color&quot;,
    &quot;default&quot;: &quot;#2F6B57&quot;,
    &quot;tsType&quot;: &quot;string&quot;,
    &quot;section&quot;: &quot;Theme&quot;,
    &quot;options&quot;: [&quot;#2F6B57&quot;, &quot;#1F5A6B&quot;, &quot;#4A5568&quot;, &quot;#8A6414&quot;]
  },
  &quot;accentDark&quot;: {
    &quot;editor&quot;: &quot;color&quot;,
    &quot;default&quot;: &quot;#5AA687&quot;,
    &quot;tsType&quot;: &quot;string&quot;,
    &quot;section&quot;: &quot;Theme&quot;,
    &quot;options&quot;: [&quot;#5AA687&quot;, &quot;#74B3C4&quot;, &quot;#96A3B5&quot;, &quot;#C4A24E&quot;]
  }
}">
const THEMES = {
  light: {
    '--bg-page': '#E9EAE5', '--bg-panel': '#FBFBF8', '--bg-inset': '#F2F2ED',
    '--ink': '#1E3A32', '--ink-body': '#33463F', '--ink-muted': '#67736D',
    '--rule': '#D6D9D3', '--rule-strong': '#1E3A32',
    '--accent': '#2F6B57', '--accent-soft': '#DCE9E1', '--danger': '#8A4A2F'
  },
  dark: {
    '--bg-page': '#191817', '--bg-panel': '#211F1E', '--bg-inset': '#2A2826',
    '--ink': '#EDEAE6', '--ink-body': '#C2BDB7', '--ink-muted': '#918B84',
    '--rule': '#363330', '--rule-strong': '#5E5852',
    '--accent': '#5AA687', '--accent-soft': '#24312C', '--danger': '#C4805F'
  }
};

class Component extends DCLogic {
  state = { dark: null, screen: null };

  componentDidMount() { this.applyVars(); }
  componentDidUpdate() { this.applyVars(); }

  isDark() { return this.state.dark === null ? (this.props.defaultDark ?? true) : this.state.dark; }
  screen() { return this.state.screen || this.props.screen || 'signin'; }

  applyVars() {
    const r = document.documentElement;
    const dark = this.isDark();
    const t = dark ? THEMES.dark : THEMES.light;
    Object.keys(t).forEach(k => r.style.setProperty(k, t[k]));
    r.style.setProperty('--accent', (dark ? this.props.accentDark : this.props.accent) || t['--accent']);
    r.style.setProperty('--seg-light-bg', dark ? 'transparent' : 'var(--accent-soft)');
    r.style.setProperty('--seg-light-ink', dark ? 'var(--ink-muted)' : 'var(--ink)');
    r.style.setProperty('--seg-dark-bg', dark ? 'var(--accent-soft)' : 'transparent');
    r.style.setProperty('--seg-dark-ink', dark ? 'var(--ink)' : 'var(--ink-muted)');
    document.body.style.background = 'var(--bg-page)';
  }

  renderVals() {
    const s = this.screen();
    return {
      isSignIn: s === 'signin',
      isRegister: s === 'register',
      crumb: s === 'signin' ? 'Access / Sign in' : 'Access / Register',
      stepLabel: s === 'signin' ? '2 fields' : '4 fields',
      setLight: () => this.setState({ dark: false }),
      setDark: () => this.setState({ dark: true }),
      showSignIn: () => this.setState({ screen: 'signin' }),
      showRegister: () => this.setState({ screen: 'register' })
    };
  }
}
</script>
</body>
</html>
