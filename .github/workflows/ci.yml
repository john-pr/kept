name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # prisma.config.ts eagerly resolves DATABASE_URL at load time, even for commands
    # (generate, lint, tsc) that never open a connection. No real database is needed here.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Node 20's bundled npm (10.x) resolves the @swc/helpers peer dependency more
      # strictly than the npm 11.x that generated package-lock.json, and fails `npm ci`
      # on a valid lockfile as a result. Match the npm major version used locally.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
