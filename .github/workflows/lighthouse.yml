name: Lighthouse

# Non-blocking quality signal against the deployed homepage. Runs on demand and weekly;
# authenticated routes and other pages are checked locally with axe (tests/e2e/a11y.spec.ts).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.json
